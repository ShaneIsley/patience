version: "2"

linters:
  default: standard
  enable:
    - errorlint
    - gocritic
    - gocyclo
    - gosec
    - misspell
    - nilerr
    - revive
    - unconvert
    - unparam
  settings:
    gocyclo:
      min-complexity: 20
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [gosec, errcheck]

formatters:
  enable:
    - gofmt
    - goimports
